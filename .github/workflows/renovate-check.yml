name: Validate Renovate Config

on:
  push:
    paths:
      - 'renovate.json'
      - '.renovate.json'
  pull_request:
    paths:
      - 'renovate.json'
      - '.renovate.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Validate Renovate Configuration
        run: npx --yes --package renovate@latest -- renovate-config-validator "{.,.github/}renovate.json*" --strict
